name: Admin API and browser tests
on:
  push:
  pull_request:
jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shelfsmart
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: shelfsmart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shelfsmart -d shelfsmart_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://shelfsmart:local-ci-only@127.0.0.1:5432/shelfsmart_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck && npm --prefix server run typecheck
      - run: npm test && npm run test:release-guard && npm --prefix server test
      - run: EXPO_NO_DOTENV=1 EXPO_PUBLIC_API_BASE_URL=http://127.0.0.1:8097 npm run export:web
      - run: npm run test:admin:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-browser-evidence
          path: /tmp/shelfsmart-admin-evidence/*.png
