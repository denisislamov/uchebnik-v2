name: Textbook regression tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    # The whole run takes some 35 minutes on the runner: 26 browser suites.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-evidence
          path: |
            docs/*browser-result.json
            docs/browser-result.json
            docs/*.png
