# New API + DB only. Existing uchebnik-v2 Static Site stays managed in Dashboard.
# Confirm the displayed monthly price before applying this paid blueprint.
services:
  - type: web
    name: shelfsmart-api
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    branch: feature/debug-source-view
    buildCommand: npm ci --prefix server --include=dev && npm --prefix server run typecheck
    startCommand: npm --prefix server start
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 24.7.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: shelfsmart-admin-db
          property: connectionString
      - key: WEB_ORIGIN
        value: https://shelfsmartacademy.com
      - key: OWNER_EMAIL
        value: islamov.denis@gmail.com
      - key: ABUSE_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
databases:
  - name: shelfsmart-admin-db
    databaseName: shelfsmart
    user: shelfsmart
    plan: 0.1c-256mb
    diskSizeGB: 5
    postgresMajorVersion: "17"
    region: frankfurt
    ipAllowList: []
    storageAutoscalingEnabled: false
