<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Страница 20 — было / стало</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #263443;
        background: #eef1ef;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px 20px 48px;
      }
      main {
        max-width: 1180px;
        margin: auto;
      }
      h1 {
        margin: 0 0 8px;
        font:
          600 32px/1.2 Georgia,
          serif;
      }
      p {
        margin: 0 0 22px;
        color: #5b6872;
        font-size: 15px;
        line-height: 1.5;
      }
      .items {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }
      article {
        background: white;
        border: 1px solid #dce2e0;
        border-radius: 12px;
        padding: 16px;
      }
      article.hero {
        grid-column: 1/-1;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }
      .pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      figure {
        margin: 0;
        min-width: 0;
      }
      figcaption {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 6px;
        color: #526169;
      }
      .frame {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 180px;
        padding: 8px;
        background: #fcfaf5;
        border: 1px solid #e6e0d4;
        border-radius: 8px;
      }
      .hero .frame {
        height: 340px;
      }
      .frame img {
        display: block;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      @media (max-width: 860px) {
        .items {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 600px) {
        body {
          padding: 18px 12px;
        }
        .items {
          grid-template-columns: 1fr;
        }
        .hero .frame {
          height: 220px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Страница 20 · было / стало</h1>
      <p>
        Два шара → один остаётся; одна из трёх карточек передана; один из
        четырёх помидоров сорван.
      </p>
      <div class="items">
        <article class="hero">
          <h2>Девочка держит два шара</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p020_girl_two_balloons.jpg"
                  alt="Исходный: Девочка держит два шара"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/p020_girl_two_balloons.png"
                  alt="Новый: Девочка держит два шара"
                />
              </div>
            </figure>
          </div>
        </article>
        <article class="hero">
          <h2>Один шар улетает</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p020_girl_balloon_flies.jpg"
                  alt="Исходный: Один шар улетает"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/p020_girl_balloon_flies.png"
                  alt="Новый: Один шар улетает"
                />
              </div>
            </figure>
          </div>
        </article>
        <article class="hero">
          <h2>Одну из трёх карточек отдали</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p020_boys_giving_object.jpg"
                  alt="Исходный: Одну из трёх карточек отдали"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/p020_boys_giving_object.png"
                  alt="Новый: Одну из трёх карточек отдали"
                />
              </div>
            </figure>
          </div>
        </article>
        <article class="hero">
          <h2>Один из четырёх помидоров сорвали</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p020_girl_picking_tomato.jpg"
                  alt="Исходный: Один из четырёх помидоров сорвали"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/p020_girl_picking_tomato.png"
                  alt="Новый: Один из четырёх помидоров сорвали"
                />
              </div>
            </figure>
          </div>
        </article>
        <article>
          <h2>Карточка 2 − 1 = 1</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p020_cards_2_minus_1.jpg"
                  alt="Исходный: Карточка 2 − 1 = 1"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/vector/p020_cards_2_minus_1.svg"
                  alt="Новый: Карточка 2 − 1 = 1"
                />
              </div>
            </figure>
          </div>
        </article>
        <article>
          <h2>Карточка 3 − 1 = 2</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p020_cards_3_minus_1.jpg"
                  alt="Исходный: Карточка 3 − 1 = 2"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/vector/p020_cards_3_minus_1.svg"
                  alt="Новый: Карточка 3 − 1 = 2"
                />
              </div>
            </figure>
          </div>
        </article>
        <article>
          <h2>Карточка 4 − 1 = 3</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p020_cards_4_minus_1.jpg"
                  alt="Исходный: Карточка 4 − 1 = 3"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/vector/p020_cards_4_minus_1.svg"
                  alt="Новый: Карточка 4 − 1 = 3"
                />
              </div>
            </figure>
          </div>
        </article>
      </div>
    </main>
  </body>
</html>
