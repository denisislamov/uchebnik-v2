<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Страница 4 — было / стало</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #263443; background: #eef1ef; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 40px 24px 56px; }
      main { max-width: 1260px; margin: auto; }
      h1 { margin: 0 0 8px; font: 600 34px/1.2 Georgia, serif; }
      p { margin: 0; color: #5b6872; font-size: 15px; line-height: 1.5; }
      section { background: #fff; border: 1px solid #dce2e0; border-radius: 12px; margin: 28px 0; padding: 24px; box-shadow: 0 3px 14px #243b3310; }
      h2 { margin: 0 0 5px; font-size: 21px; line-height: 1.3; }
      .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
      figure { margin: 0; min-width: 0; }
      figcaption { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 10px; color: #526169; }
      .frame { display: flex; align-items: center; justify-content: center; min-height: 455px; padding: 20px; background: #fcfaf5; border: 1px solid #e6e0d4; border-radius: 8px; }
      .frame img { display: block; width: 100%; max-width: 530px; max-height: 430px; object-fit: contain; }
      .sample .frame { min-height: 190px; }
      .sample .frame img { max-height: 150px; }
      @media (max-width: 800px) {
        body { padding: 18px 12px; }
        h1 { font-size: 27px; }
        section { padding: 16px; }
        .pair { grid-template-columns: 1fr; }
        .frame { min-height: 270px; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Страница 4 · было / стало</h1>
      <p>Сцена у реки сохраняет счёт; три небольших образца для рисования переведены в чистый вектор.</p>
      <section>
        <h2>Дети у реки</h2>
        <p>10 детей в четырёх группах · 5 деревьев · 1 собака · 1 лодочка</p>
        <div class="pair">
          <figure><figcaption>Было</figcaption><div class="frame"><img src="../../assets/book/p004_boys_river_bathing.jpg" alt="Исходная сцена у реки" /></div></figure>
          <figure><figcaption>Стало</figcaption><div class="frame"><img src="../../assets/book2/p004_boys_river_bathing@2x.png" alt="Обновлённая акварельная сцена у реки" /></div></figure>
        </div>
      </section>
      <section class="sample">
        <h2>Чёрточки и красные точки</h2>
        <div class="pair"><figure><figcaption>Было</figcaption><div class="frame"><img src="../../assets/book/p004_dashes_dots_line.jpg" alt="Исходный образец чёрточек и точек" /></div></figure><figure><figcaption>Стало</figcaption><div class="frame"><img src="../../assets/book2/vector/p004_dashes_dots_line.svg" alt="Новый образец чёрточек и точек" /></div></figure></div>
      </section>
      <section class="sample">
        <h2>Три ёлочки</h2>
        <div class="pair"><figure><figcaption>Было</figcaption><div class="frame"><img src="../../assets/book/p004_fir_trees_sample.jpg" alt="Исходный образец ёлочек" /></div></figure><figure><figcaption>Стало</figcaption><div class="frame"><img src="../../assets/book2/vector/p004_fir_trees_sample.svg" alt="Новый образец ёлочек" /></div></figure></div>
      </section>
      <section class="sample">
        <h2>Десять квадратов</h2>
        <div class="pair"><figure><figcaption>Было</figcaption><div class="frame"><img src="../../assets/book/p004_squares_row_sample.jpg" alt="Исходный образец квадратов" /></div></figure><figure><figcaption>Стало</figcaption><div class="frame"><img src="../../assets/book2/vector/p004_squares_row_sample.svg" alt="Новый образец квадратов" /></div></figure></div>
      </section>
    </main>
  </body>
</html>
