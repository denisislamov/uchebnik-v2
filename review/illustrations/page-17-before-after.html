<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Страница 17 — было / стало</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #263443;
        background: #eef1ef;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px 20px 48px;
      }
      main {
        max-width: 1180px;
        margin: auto;
      }
      h1 {
        margin: 0 0 8px;
        font:
          600 32px/1.2 Georgia,
          serif;
      }
      p {
        margin: 0 0 22px;
        color: #5b6872;
        font-size: 15px;
        line-height: 1.5;
      }
      .items {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }
      article {
        background: white;
        border: 1px solid #dce2e0;
        border-radius: 12px;
        padding: 16px;
      }
      article.hero {
        grid-column: 1/-1;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }
      .pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      figure {
        margin: 0;
        min-width: 0;
      }
      figcaption {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 6px;
        color: #526169;
      }
      .frame {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 180px;
        padding: 8px;
        background: #fcfaf5;
        border: 1px solid #e6e0d4;
        border-radius: 8px;
      }
      .hero .frame {
        height: 340px;
      }
      .frame img {
        display: block;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      @media (max-width: 860px) {
        .items {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 600px) {
        body {
          padding: 18px 12px;
        }
        .items {
          grid-template-columns: 1fr;
        }
        .hero .frame {
          height: 220px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Страница 17 · было / стало</h1>
      <p>
        Три белых кролика и один чёрный; четыре морковки слева и одна справа;
        образцы сложения.
      </p>
      <div class="items">
        <article class="hero">
          <h2>Кролики: 3 белых + 1 чёрный</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p017_rabbits.jpg"
                  alt="Исходный: Кролики: 3 белых + 1 чёрный"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/p017_rabbits.png"
                  alt="Новый: Кролики: 3 белых + 1 чёрный"
                />
              </div>
            </figure>
          </div>
        </article>
        <article class="hero">
          <h2>Морковки: 4 + 1</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p017_carrots.jpg"

                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/p017_carrots.png"
                  alt="Новый: Морковки: 4 + 1"
                />
              </div>
            </figure>
          </div>
        </article>
        <article>
          <h2>Кружки 1 + 1</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p017_circles_1_plus_1.jpg"
                  alt="Исходный: Кружки 1 + 1"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/vector/p017_circles_1_plus_1.svg"
                  alt="Новый: Кружки 1 + 1"
                />
              </div>
            </figure>
          </div>
        </article>
        <article>
          <h2>Кружки 2 + 1</h2>

                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/vector/p017_circles_2_plus_1.svg"
                  alt="Новый: Кружки 2 + 1"
                />
              </div>
            </figure>
          </div>
        </article>
        <article>
          <h2>Кружки 3 + 1</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p017_circles_3_plus_1.jpg"
                  alt="Исходный: Кружки 3 + 1"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/vector/p017_circles_3_plus_1.svg"
                  alt="Новый: Кружки 3 + 1"
                />
              </div>
            </figure>
          </div>
        </article>
        <article>
          <h2>Кружки 4 + 1</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p017_circles_4_plus_1.jpg"
                  alt="Исходный: Кружки 4 + 1"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/vector/p017_circles_4_plus_1.svg"
                  alt="Новый: Кружки 4 + 1"
                />
              </div>
            </figure>
          </div>
        </article>
        <article>
          <h2>Рукописные примеры +1</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p017_handwritten_sums_plus_1.jpg"
                  alt="Исходный: Рукописные примеры +1"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img

              </div>
            </figure>
          </div>
        </article>
      </div>
    </main>
  </body>
</html>
