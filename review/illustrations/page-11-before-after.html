<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Страница 11 — было / стало</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #263443;
        background: #eef1ef;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px 20px 48px;
      }
      main {
        max-width: 1180px;
        margin: auto;
      }
      h1 {
        margin: 0 0 8px;
        font:
          600 32px/1.2 Georgia,
          serif;
      }
      p {
        margin: 0 0 22px;
        color: #5b6872;
        font-size: 15px;
        line-height: 1.5;
      }
      .items {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }
      article {
        background: white;
        border: 1px solid #dce2e0;
        border-radius: 12px;
        padding: 16px;
      }
      article.hero {
        grid-column: 1/-1;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }
      .pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      figure {
        margin: 0;
        min-width: 0;
      }
      figcaption {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 6px;
        color: #526169;
      }
      .frame {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 180px;
        padding: 8px;
        background: #fcfaf5;
        border: 1px solid #e6e0d4;
        border-radius: 8px;
      }
      .hero .frame {
        height: 340px;
      }
      .frame img {
        display: block;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      @media (max-width: 860px) {
        .items {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 600px) {
        body {
          padding: 18px 12px;
        }
        .items {
          grid-template-columns: 1fr;
        }
        .hero .frame {
          height: 220px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Страница 11 · было / стало</h1>
      <p>
        Три ребёнка на современных трёхколёсных велосипедах; два отдельных
        способа разложить три мяча.
      </p>
      <div class="items">
        <article class="hero">
          <h2>Трое детей на трёхколёсных велосипедах</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p011_children_tricycles.jpg"
                  alt="Исходный: Трое детей на трёхколёсных велосипедах"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/p011_children_tricycles@2x.png"
                  alt="Обновлённый: Трое детей на трёхколёсных велосипедах"
                />
              </div>
            </figure>
          </div>
        </article>
        <article class="">
          <h2>Два мяча и ещё один</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p011_balls_left_2_and_1.jpg"
                  alt="Исходный: Два мяча и ещё один"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/p011_balls_left_2_and_1@2x.png"
                  alt="Обновлённый: Два мяча и ещё один"
                />
              </div>
            </figure>
          </div>
        </article>
        <article class="">
          <h2>Один мяч и ещё два</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p011_balls_right_1_and_2.jpg"
                  alt="Исходный: Один мяч и ещё два"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/p011_balls_right_1_and_2@2x.png"
                  alt="Обновлённый: Один мяч и ещё два"
                />
              </div>
            </figure>
          </div>
        </article>
        <article class="">
          <h2>Оба набора вместе — резервный ресурс</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p011_balls_row_3_groups.jpg"
                  alt="Исходный: Оба набора вместе — резервный ресурс"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/vector/p011_balls_row_3_groups.svg"
                  alt="Обновлённый: Оба набора вместе — резервный ресурс"
                />
              </div>
            </figure>
          </div>
        </article>
        <article class="">
          <h2>Квадратики 2 + 1</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p011_three_squares_2_1.jpg"
                  alt="Исходный: Квадратики 2 + 1"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/vector/p011_three_squares_2_1.svg"
                  alt="Обновлённый: Квадратики 2 + 1"
                />
              </div>
            </figure>
          </div>
        </article>
        <article class="">
          <h2>Графическая полоса</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p011_writing_strip_squares_rects.jpg"
                  alt="Исходный: Графическая полоса"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/vector/p011_writing_strip_squares_rects.svg"
                  alt="Обновлённый: Графическая полоса"
                />
              </div>
            </figure>
          </div>
        </article>
      </div>
    </main>
  </body>
</html>
