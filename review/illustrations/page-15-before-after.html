<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Страница 15 — было / стало</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #263443;
        background: #eef1ef;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px 20px 48px;
      }
      main {
        max-width: 1180px;
        margin: auto;
      }
      h1 {
        margin: 0 0 8px;
        font:
          600 32px/1.2 Georgia,
          serif;
      }
      p {
        margin: 0 0 22px;
        color: #5b6872;
        font-size: 15px;
        line-height: 1.5;
      }
      .items {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }
      article {
        background: white;
        border: 1px solid #dce2e0;
        border-radius: 12px;
        padding: 16px;
      }
      article.hero {
        grid-column: 1/-1;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }
      .pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      figure {
        margin: 0;
        min-width: 0;
      }
      figcaption {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 6px;
        color: #526169;
      }
      .frame {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 180px;
        padding: 8px;
        background: #fcfaf5;
        border: 1px solid #e6e0d4;
        border-radius: 8px;
      }
      .hero .frame {
        height: 340px;
      }
      .frame img {
        display: block;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      @media (max-width: 860px) {
        .items {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 600px) {
        body {
          padding: 18px 12px;
        }
        .items {
          grid-template-columns: 1fr;
        }
        .hero .frame {
          height: 220px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Страница 15 · было / стало</h1>
      <p>
        Пять ромашек → четыре на кусте и одна в руке; современные учебные монеты
        и счётные орехи.
      </p>
      <div class="items">
        <article class="hero">
          <h2>Пять ромашек на кусте</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p015_girl_daisies_1.jpg"
                  alt="Исходный: Пять ромашек на кусте"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/p015_girl_daisies_1.png"
                  alt="Новый: Пять ромашек на кусте"
                />
              </div>
            </figure>
          </div>
        </article>
        <article class="hero">
          <h2>Четыре ромашки осталось</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p015_girl_daisies_2.jpg"
                  alt="Исходный: Четыре ромашки осталось"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/p015_girl_daisies_2.png"
                  alt="Новый: Четыре ромашки осталось"
                />
              </div>
            </figure>
          </div>
        </article>
        <article>
          <h2>Квадраты 4 + 1</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p015_squares_4_1.jpg"
                  alt="Исходный: Квадраты 4 + 1"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/vector/p015_squares_4_1.svg"
                  alt="Новый: Квадраты 4 + 1"
                />
              </div>
            </figure>
          </div>
        </article>
        <article>
          <h2>Орехи 3 + 2</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p015_nuts_frame_1.jpg"
                  alt="Исходный: Орехи 3 + 2"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/vector/p015_nuts_frame_1.svg"
                  alt="Новый: Орехи 3 + 2"
                />
              </div>
            </figure>
          </div>
        </article>
        <article>
          <h2>Орехи 2 + 3</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p015_nuts_frame_2.jpg"
                  alt="Исходный: Орехи 2 + 3"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/vector/p015_nuts_frame_2.svg"
                  alt="Новый: Орехи 2 + 3"
                />
              </div>
            </figure>
          </div>
        </article>
        <article>
          <h2>Орехи 4 + 1</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p015_nuts_frame_3.jpg"
                  alt="Исходный: Орехи 4 + 1"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/vector/p015_nuts_frame_3.svg"
                  alt="Новый: Орехи 4 + 1"
                />
              </div>
            </figure>
          </div>
        </article>
        <article>
          <h2>Орехи 1 + 4</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p015_nuts_frame_4.jpg"
                  alt="Исходный: Орехи 1 + 4"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/vector/p015_nuts_frame_4.svg"
                  alt="Новый: Орехи 1 + 4"
                />
              </div>
            </figure>
          </div>
        </article>
        <article>
          <h2>Столбики орехов 1–5</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img

            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/vector/p015_nuts_columns_1_5.svg"
                  alt="Новый: Столбики орехов 1–5"
                />
              </div>
            </figure>
          </div>
        </article>
      </div>
    </main>
  </body>
</html>
