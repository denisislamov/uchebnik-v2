<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Обложка — было / стало</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #263443; background: #eef1ef; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px 20px 48px; }
      main { max-width: 1120px; margin: auto; }
      h1 { margin: 0 0 8px; font: 600 32px/1.2 Georgia, serif; }
      p { margin: 0 0 22px; color: #5b6872; font-size: 15px; line-height: 1.5; }
      .items { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      article { background: white; border: 1px solid #dce2e0; border-radius: 12px; padding: 16px; }
      h2 { margin: 0 0 12px; font-size: 18px; }
      .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      figure { margin: 0; min-width: 0; }
      figcaption { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; color: #526169; }
      .frame { display: flex; align-items: center; justify-content: center; height: 230px; padding: 12px; background: #fcfaf5; border: 1px solid #e6e0d4; border-radius: 8px; }
      .frame img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
      @media (max-width: 650px) { .items { grid-template-columns: 1fr; } body { padding: 18px 12px; } .frame { height: 180px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Обложка · было / стало</h1>
      <p>Семь групп предметов с числами 1–7 и утверждённый заголовок «Арифметика · 1 класс».</p>
      <div class="items" id="items"></div>
    </main>
    <script>
      const items = [
        ["Гриб · 1", "p001_cover_mushroom_1", "png"],
        ["Жёлуди · 2", "p001_cover_acorns_2", "png"],
        ["Ромашки · 3", "p001_cover_daisies_3", "png"],
        ["Рыбки · 4", "p001_cover_fish_4", "png"],
        ["Цыплята · 5", "p001_cover_chicks_5", "png"],
        ["Красная смородина · 6", "p001_cover_red_currants_6", "png"],
        ["Чёрная смородина · 7", "p001_cover_black_currants_7", "png"],
        ["Название", "p001_cover_title_frame", "svg"],
      ];
      document.getElementById("items").innerHTML = items.map(([label, id, ext]) => `
        <article><h2>${label}</h2><div class="pair">
          <figure><figcaption>Было</figcaption><div class="frame"><img src="../../assets/book/${id}.jpg" alt="Исходный ${label}" /></div></figure>
          <figure><figcaption>Стало</figcaption><div class="frame"><img src="../../assets/book2/${ext === "svg" ? "vector/" : ""}${id}${ext === "svg" ? ".svg" : "@2x.png"}" alt="Обновлённый ${label}" /></div></figure>
        </div></article>`).join("");
    </script>
  </body>
</html>
