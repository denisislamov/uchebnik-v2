<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Страница 10 — было / стало</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #263443;
        background: #eef1ef;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px 20px 48px;
      }
      main {
        max-width: 1180px;
        margin: auto;
      }
      h1 {
        margin: 0 0 8px;
        font:
          600 32px/1.2 Georgia,
          serif;
      }
      p {
        margin: 0 0 22px;
        color: #5b6872;
        font-size: 15px;
        line-height: 1.5;
      }
      .items {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }
      article {
        background: white;
        border: 1px solid #dce2e0;
        border-radius: 12px;
        padding: 16px;
      }
      article.hero {
        grid-column: 1/-1;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }
      .pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      figure {
        margin: 0;
        min-width: 0;
      }
      figcaption {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 6px;
        color: #526169;
      }
      .frame {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 180px;
        padding: 8px;
        background: #fcfaf5;
        border: 1px solid #e6e0d4;
        border-radius: 8px;
      }
      .hero .frame {
        height: 340px;
      }
      .frame img {
        display: block;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      @media (max-width: 860px) {
        .items {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 600px) {
        body {
          padding: 18px 12px;
        }
        .items {
          grid-template-columns: 1fr;
        }
        .hero .frame {
          height: 220px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Страница 10 · было / стало</h1>
      <p>
        Двое рыбачат, третий подходит; отдельные предметы помогают увидеть число
        3 и состав 2 + 1.
      </p>
      <div class="items">
        <article class="hero">
          <h2>Трое рыбаков</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p010_boys_fishing.jpg"
                  alt="Исходный: Трое рыбаков"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/p010_boys_fishing@2x.png"
                  alt="Обновлённый: Трое рыбаков"
                />
              </div>
            </figure>
          </div>
        </article>
        <article class="">
          <h2>Три рыбы</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p010_three_fish.jpg"
                  alt="Исходный: Три рыбы"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/p010_three_fish@2x.png"
                  alt="Обновлённый: Три рыбы"
                />
              </div>
            </figure>
          </div>
        </article>
        <article class="">
          <h2>Три ягоды земляники</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p010_three_strawberries.jpg"
                  alt="Исходный: Три ягоды земляники"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/p010_three_strawberries@2x.png"
                  alt="Обновлённый: Три ягоды земляники"
                />
              </div>
            </figure>
          </div>
        </article>
        <article class="">
          <h2>Счётная линейка: 2 + 1</h2>

            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p010_abacus_3.jpg"

                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/vector/p010_abacus_3.svg"
                  alt="Обновлённый: Счётная линейка: 2 + 1"
                />
              </div>
            </figure>
          </div>
        </article>
        <article class="">
          <h2>Три точки: 2 + 1</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p010_domino_3.jpg"
                  alt="Исходный: Три точки: 2 + 1"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/vector/p010_domino_3.svg"
                  alt="Обновлённый: Три точки: 2 + 1"
                />
              </div>
            </figure>
          </div>
        </article>
        <article class="">
          <h2>Три кружка</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p010_three_green_dots.jpg"
                  alt="Исходный: Три кружка"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book2/vector/p010_three_green_dots.svg"
                  alt="Обновлённый: Три кружка"
                />
              </div>
            </figure>
          </div>
        </article>
        <article class="">
          <h2>Цифра 3</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p010_digit_3_print.jpg"
                  alt="Исходный: Цифра 3"
                />
              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">

            </figure>
          </div>
        </article>
        <article class="">
          <h2>Учебная монета</h2>
          <div class="pair">
            <figure>

              <div class="frame">
                <img

        </article>
        <article class="">
          <h2>Пишем 3</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">

        <article class="">
          <h2>Два треугольника</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img

            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">

        </article>
        <article class="">
          <h2>Рисуем три вишни</h2>
          <div class="pair">
            <figure>
              <figcaption>Было</figcaption>
              <div class="frame">
                <img
                  src="../../assets/book/p010_cherries_draw.jpg"

              </div>
            </figure>
            <figure>
              <figcaption>Стало</figcaption>
              <div class="frame">
                <img

                  alt="Обновлённый: Рисуем три вишни"
                />
              </div>
            </figure>
          </div>
        </article>
      </div>
    </main>
  </body>
</html>
